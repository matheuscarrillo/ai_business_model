[build-system]
requires = ["setuptools==68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-business-model" 
description = "Modelo para atender melhor clientes de empresas de varejo"
readme = "README.md"
requires-python = "==3.11.*"
dynamic = ["dependencies"]
version = "0.1.0"

[tool.setuptools]
package-dir = {"" = "app/src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
